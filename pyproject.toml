[project]
name = "wattop"
description = "btop-style terminal power monitor: power in/out, volts and amps, per-rail SoC power"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sravan Pannala", email = "sra.djoker@gmail.com" }]
keywords = [
    "power", "watts", "battery", "energy", "monitor", "tui", "terminal",
    "sensors", "hwmon", "rapl", "snapdragon", "arm64",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Power (UPS)",
    "Typing :: Typed",
]
dependencies = [
    # 2.1 is the oldest release the dashboard was actually exercised against
    # (headless App.run_test, all six graphs, every keybinding). It is also what
    # Debian 13 ships, so the floor is what the distro packages can satisfy.
    "textual>=2.1",
    # Imported directly by wattop/ui/app.py. Textual pulls it in too, but that
    # is its business and not a promise, so declare what we import.
    "rich>=13",
    # tmux and byobu name windows from /proc cmdline's argv[0], which for any
    # Python launch is the interpreter -- so the window says "python3" until the
    # argv is rewritten in place. Linux-only: that is where the multiplexers
    # live, and it keeps Windows ARM64 free of a wheel it does not need. The
    # import is guarded, so packagers may drop it and lose only the name.
    #
    # And only where PyPI has a wheel for it. It is a C extension, so on 32-bit
    # Raspberry Pi OS or RISC-V pip would compile it, and without gcc the whole
    # install fails -- for a window name. Those machines skip it instead.
    "setproctitle>=1.3; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
dynamic = ["version"]

[project.optional-dependencies]
# No Windows ARM64 wheel exists for pyarrow, so `wattop[parquet]` does not
# install on the flagship platform. CSV logging is always available.
parquet = ["pyarrow>=17"]

[project.urls]
Homepage = "https://github.com/sravanpannala/wattop"
Repository = "https://github.com/sravanpannala/wattop"
Issues = "https://github.com/sravanpannala/wattop/issues"
Changelog = "https://github.com/sravanpannala/wattop/blob/main/CHANGELOG.md"

[project.scripts]
wattop = "wattop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wattop/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wattop"]

[tool.hatch.build.targets.sdist]
include = [
    "/wattop",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
    "/config.example.toml",
    "/packaging",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "BLE", "A", "RUF"]
ignore = [
    # The sources deliberately swallow broad exceptions so one dead sensor
    # never costs the rest of the dashboard; each site carries a justification.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into app internals on purpose: the point is to assert on layout
# state that has no public accessor.
"tests/*" = ["SLF001"]
