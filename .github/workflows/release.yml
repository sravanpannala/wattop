name: Release

on:
  push:
    tags: ["v*"]

# Trusted Publishing: PyPI verifies this workflow's OIDC token, so there is no
# API token to store or rotate. Configure the publisher once at
# https://pypi.org/manage/project/wattop/settings/publishing/
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The tag is the source of truth; wattop/__init__.py must agree, or the
      # wheel on PyPI says something the release notes do not.
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import wattop; print(wattop.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The sdist is attached because the AUR, COPR and Build Service recipes
      # all build from a release tarball rather than from PyPI.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
