[project]
name = "wattop"
version = "0.1.0"
description = "btop-style terminal power monitor: power in/out, volts and amps, per-rail SoC power"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.optional-dependencies]
parquet = ["pyarrow>=17"]

[project.scripts]
wattop = "wattop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wattop"]
