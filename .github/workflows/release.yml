name: Release

on:
  push:
    tags: ["v*"]

# Trusted Publishing: PyPI verifies this workflow's OIDC token, so there is no
# API token to store or rotate. Configure the publisher once at
# https://pypi.org/manage/project/wattop/settings/publishing/
permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The tag is the source of truth; wattop/__init__.py must agree, or the
      # wheel on PyPI says something the release notes do not.
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(uv run python -c 'import wattop; print(wattop.__version__)')"
          echo "tag=$tag package=$pkg"
          test "$tag" = "$pkg"

      - run: uv build
      - run: uvx twine check dist/*

      # A zipapp of pure Python: one file that runs on every OS and processor
      # with a system Python, and the artifact the Scoop manifest installs. Not
      # a frozen binary -- nothing is compiled and there is no bootloader for a
      # virus scanner to take exception to.
      - name: Build the zipapp
        run: uvx shiv -c wattop -o dist/wattop.pyz dist/*.whl

      - name: Smoke-test the zipapp
        run: |
          python dist/wattop.pyz --version
          python dist/wattop.pyz --list || echo "no sensors on this runner, which is fine"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # The sdist is attached because the AUR, COPR and Build Service recipes
      # all build from a release tarball rather than from PyPI.
      # Stamp the Scoop manifest with the version and the real hash, so the
      # bucket can be updated by copying one file rather than editing it.
      - name: Stamp the Scoop manifest
        run: |
          python packaging/scoop/stamp.py "${GITHUB_REF_NAME}" dist/wattop.pyz
          cp packaging/scoop/wattop.json dist/

      # Attach a PKGBUILD pinned to this release's own sdist, so an Arch user
      # needs one URL and two commands and makepkg verifies what it downloads.
      - name: Stamp the PKGBUILD
        run: |
          version="${GITHUB_REF_NAME#v}"
          sum=$(sha256sum "dist/wattop-${version}.tar.gz" | cut -d' ' -f1)
          sed -e "s/^pkgver=.*/pkgver=${version}/"               -e "s/^sha256sums=.*/sha256sums=('${sum}')/"               packaging/aur/PKGBUILD > dist/PKGBUILD
          grep -E '^(pkgver|sha256sums)=' dist/PKGBUILD

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
